<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="128" height="128">
  <defs>
    <clipPath id="diamondClip">
      <path d="M8.7071 1.9071 L14.0929 7.2929 Q14.8 8 14.0929 8.7071 L8.7071 14.0929
               Q8 14.8 7.2929 14.0929 L1.9071 8.7071 Q1.2 8 1.9071 7.2929
               L7.2929 1.9071 Q8 1.2 8.7071 1.9071 Z" />
    </clipPath>
    <linearGradient id="leftGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#332552" />
      <stop offset="1" stop-color="#1F1735" />
    </linearGradient>
    <linearGradient id="rightGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F4FF" />
      <stop offset="1" stop-color="#D9CEFF" />
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0.35" stdDeviation="0.4" flood-color="#20153D" flood-opacity="0.4" />
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <g clip-path="url(#diamondClip)">
      <rect x="0" y="0" width="8" height="16" fill="url(#leftGrad)" />
      <rect x="8" y="0" width="8" height="16" fill="url(#rightGrad)" />
    </g>
    <path d="M8.7071 1.9071 L14.0929 7.2929 Q14.8 8 14.0929 8.7071 L8.7071 14.0929
             Q8 14.8 7.2929 14.0929 L1.9071 8.7071 Q1.2 8 1.9071 7.2929
             L7.2929 1.9071 Q8 1.2 8.7071 1.9071 Z"
          fill="none" stroke="#5A3FE0" stroke-width="0.18" stroke-opacity="0.6" />
  </g>

  <!-- left: small flowchart (circle -> diamond -> circle, with a branch square) -->
  <g stroke="#C9BBFF" stroke-width="0.55" stroke-linecap="round">
    <line x1="5.0" y1="5.3" x2="5.6" y2="8.0" />
    <line x1="5.6" y1="8.0" x2="5.0" y2="10.7" />
    <line x1="4.75" y1="8.0" x2="2.75" y2="8.0" />
  </g>
  <circle cx="5.0" cy="5.3" r="0.85" fill="#EDE6FF" />
  <circle cx="5.0" cy="10.7" r="0.85" fill="#EDE6FF" />
  <path d="M5.6 7.05 L6.55 8.0 L5.6 8.95 L4.65 8.0 Z" fill="#EDE6FF" />
  <rect x="1.85" y="7.25" width="1.5" height="1.5" rx="0.35" fill="#EDE6FF" />

  <!-- right: paragraph lines, widths mirroring the diamond's silhouette -->
  <g fill="#7C5CFC">
    <rect x="9.3" y="4.88" width="2.3" height="0.85" rx="0.22" />
    <rect x="9.3" y="6.23" width="3.2" height="0.85" rx="0.22" />
    <rect x="9.3" y="7.58" width="4.4" height="0.85" rx="0.22" />
    <rect x="9.3" y="8.93" width="3.2" height="0.85" rx="0.22" />
    <rect x="9.3" y="10.28" width="2.3" height="0.85" rx="0.22" />
  </g>
</svg>
