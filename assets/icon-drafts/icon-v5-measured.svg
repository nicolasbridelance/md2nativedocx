<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="128" height="128">
  <!-- Split-diamond "graph -> text" concept, redrawn from measured geometry (see
       assets/icon-drafts/README.md): vertex/shape/bar positions and colors were
       measured programmatically from icon-v1-reference-crop.png (pixel-color
       boundary scans + connected-component centroids), not eyeballed like v2/v3.
       Two corrections v3 got wrong: the right half's fill is a flat medium
       purple with WHITE bars (v3 had it inverted: light fill, purple bars), and
       the left-half graph shapes are the SAME medium purple as the right half
       (v3 used a light lavender, mismatched). Left-half gradient was already
       accurate in v3 and is kept as-is. -->
  <defs>
    <clipPath id="diamondClip5">
      <path d="M8.7071 1.9071 L14.0929 7.2929 Q14.8 8 14.0929 8.7071 L8.7071 14.0929
               Q8 14.8 7.2929 14.0929 L1.9071 8.7071 Q1.2 8 1.9071 7.2929
               L7.2929 1.9071 Q8 1.2 8.7071 1.9071 Z" />
    </clipPath>
    <linearGradient id="leftGrad5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#332552" />
      <stop offset="1" stop-color="#1F1735" />
    </linearGradient>
    <linearGradient id="rightGrad5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8A72F7" />
      <stop offset="1" stop-color="#6B4FE8" />
    </linearGradient>
    <filter id="shadow5" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0.35" stdDeviation="0.4" flood-color="#20153D" flood-opacity="0.4" />
    </filter>
  </defs>

  <g filter="url(#shadow5)">
    <g clip-path="url(#diamondClip5)">
      <rect x="0" y="0" width="8" height="16" fill="url(#leftGrad5)" />
      <rect x="8" y="0" width="8" height="16" fill="url(#rightGrad5)" />
    </g>
    <path d="M8.7071 1.9071 L14.0929 7.2929 Q14.8 8 14.0929 8.7071 L8.7071 14.0929
             Q8 14.8 7.2929 14.0929 L1.9071 8.7071 Q1.2 8 1.9071 7.2929
             L7.2929 1.9071 Q8 1.2 8.7071 1.9071 Z"
          fill="none" stroke="#5A3FE0" stroke-width="0.18" stroke-opacity="0.6" />
  </g>

  <!-- left: measured mini flowchart: square and top circle converge into the
       small diamond's top vertex, small diamond's bottom vertex feeds the
       bottom circle. Same purple as the right half's fill (measured). -->
  <g stroke="#7D63F5" stroke-width="0.55" stroke-linecap="round">
    <line x1="6.197" y1="5.796" x2="6.097" y2="6.998" />
    <line x1="6.097" y1="9.002" x2="6.097" y2="10.204" />
    <line x1="4.194" y1="8.000" x2="6.097" y2="6.998" />
  </g>
  <circle cx="6.197" cy="5.796" r="0.801" fill="#7D63F5" />
  <circle cx="6.097" cy="10.204" r="0.801" fill="#7D63F5" />
  <path d="M6.097 6.998 L7.349 8.000 L6.097 9.002 L4.845 8.000 Z" fill="#7D63F5" />
  <rect x="3.293" y="7.099" width="1.803" height="1.803" rx="0.42" fill="#7D63F5" />

  <!-- right: measured paragraph bars: white on the flat purple fill (v3 had
       this inverted). Widths/positions/spacing measured, not a guessed taper. -->
  <g fill="#F7F7FE">
    <rect x="8.901" y="5.596" width="1.502" height="0.42" rx="0.2" />
    <rect x="8.802" y="6.798" width="2.804" height="0.42" rx="0.2" />
    <rect x="8.901" y="7.900" width="3.606" height="0.42" rx="0.2" />
    <rect x="8.802" y="9.102" width="2.804" height="0.42" rx="0.2" />
    <rect x="8.901" y="10.204" width="1.502" height="0.42" rx="0.2" />
  </g>
</svg>
