name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: Typecheck, lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit + golden tests
        run: npm run test

      - name: Fuzz tests (core)
        run: npm run test:fuzz

  audit:
    name: npm audit (fail on high/critical)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit
        run: npm audit --audit-level=high

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Visual-regression tests need LibreOffice headless and are slower; run them
  # on a schedule and on release branches rather than every PR. This trade-off
  # is explicit: see AGENTS.md → CI/CD.
  visual:
    name: Visual regression (LibreOffice headless)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || startsWith(github.ref, 'refs/heads/release/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Pandoc + Lua
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pandoc lua5.4
      - name: Install LibreOffice headless
        run: sudo apt-get install -y -qq libreoffice-writer libreoffice-impress
      - run: npm ci
      - name: Visual tests
        run: npm run test:visual
