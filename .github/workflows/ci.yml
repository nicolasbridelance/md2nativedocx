name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: Typecheck, lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Pandoc + Lua
        # The vscode-extension unit tests (exportService.test.ts) invoke the
        # real CLI -> Pandoc pipeline, not a mock — same requirement as the
        # visual job below, kept in sync deliberately (AGENTS.md).
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pandoc lua5.4

      - uses: actions/setup-dotnet@v4
        # Optional dependency: only used by scripts/oxml-validator/ (npm run
        # test:oxml-validate, AGENTS.md → "Diagnosing 'Word won't open the
        # file'"). Version kept in sync with .devcontainer/setup.sh's
        # DOTNET_SDK_VERSION. test:oxml-validate degrades gracefully without
        # it, so this step failing should not be treated as unusual — it
        # just means that one check gets skipped.
        with:
          dotnet-version: '10.0.200'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit + golden tests (with JUnit + LCOV reports)
        run: npm run test:ci

      - name: Fuzz tests (core)
        run: npm run test:fuzz

      - name: Open XML schema validation
        run: npm run test:oxml-validate

      - name: Verify npm packages (clean-room install of core/pandoc-filter/cli)
        # OS-independent by nature (this is about npm's package-resolution
        # layout, not platform code) — one job is enough, unlike
        # build-test-windows/-macos above.
        run: npm run verify:npm-packages

      - name: Write job summary
        if: always()
        run: node scripts/ci-summary.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test & coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ github.sha }}
          path: packages/*/reports/**
          retention-days: 90
          if-no-files-found: warn

  # 2026-09-08: the build-test job above has always run on ubuntu-latest only.
  # That gap is exactly how a universal, on-by-default Windows export failure
  # (unzip/zip absent from stock Windows) and a separate Windows-only .vsix
  # bundling bug (a CJS dependency mis-bundled into ESM) both shipped
  # undetected until a real user's machine hit them. This job closes that
  # gap: it runs the packages most exercised by that incident (cli/core/
  # pandoc-filter) on Windows, and — the check that would have caught the
  # *second* bug on its own — actually builds the packaged .vsix, not just
  # the source tree. Deliberately narrower than build-test (no lint/fuzz/
  # oxml-validate): those are OS-independent logic already covered on Linux;
  # this job's whole purpose is the OS-sensitive surface, not full duplication.
  build-test-windows:
    name: Typecheck & test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Pandoc
        uses: r-lib/actions/setup-pandoc@v2
        with:
          pandoc-version: '3.1.3'

      - uses: actions/setup-dotnet@v4
        # Needed to build scripts/oxml-validator/ during `npm run package`
        # below (packaging always bundles it, see bundle-oxml-validator.mjs).
        # Version kept in sync with build-test's own setup-dotnet step.
        with:
          dotnet-version: '10.0.200'

      - name: Install unzip and zip
        # Test-only: a handful of test helpers (not shipped product code —
        # the CLI itself has had no unzip/zip dependency since 2026-09-08)
        # still shell out to `unzip`/`zip` to inspect/build a .docx fixture.
        run: choco install unzip zip -y

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Unit + golden tests (cli, core, pandoc-filter)
        run: npm run test --workspace=@md2nativedocx/cli --workspace=@md2nativedocx/core --workspace=@md2nativedocx/pandoc-filter

      - name: Build the packaged extension (.vsix)
        # Exercises the esbuild bundling step end to end — the vendored CLI's
        # own smoke test (bundle-cli.mjs) runs a real export through it. This
        # is what would have caught the adm-zip CJS-into-ESM bundling bug.
        run: npm run package --workspace=md2nativedocx

  # Same reasoning as build-test-windows above: pandocProvisioner.ts/
  # dotnetProvisioner.ts have had full darwin-x64/darwin-arm64 manifest
  # entries for a while, but nothing had ever actually run this project's
  # test suite — let alone built the packaged .vsix — on a real macOS
  # runner. Unlike Windows, no extra `zip`/`unzip` install step is needed:
  # both ship natively on macOS.
  build-test-macos:
    name: Typecheck & test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Pandoc
        uses: r-lib/actions/setup-pandoc@v2
        with:
          pandoc-version: '3.1.3'

      - uses: actions/setup-dotnet@v4
        # Needed to build scripts/oxml-validator/ during `npm run package`
        # below (packaging always bundles it, see bundle-oxml-validator.mjs).
        # Version kept in sync with build-test's own setup-dotnet step.
        with:
          dotnet-version: '10.0.200'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Unit + golden tests (cli, core, pandoc-filter)
        run: npm run test --workspace=@md2nativedocx/cli --workspace=@md2nativedocx/core --workspace=@md2nativedocx/pandoc-filter

      - name: Build the packaged extension (.vsix)
        run: npm run package --workspace=md2nativedocx

  audit:
    name: npm audit (fail on high/critical)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Save audit report (dated artifact, doesn't gate)
        if: always()
        run: |
          mkdir -p reports
          npm audit --json > reports/npm-audit.json || true
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: npm-audit-${{ github.sha }}
          path: reports/npm-audit.json
          retention-days: 90
          if-no-files-found: warn
      - name: Audit (fails the build on high/critical)
        run: npm audit --audit-level=high

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Visual-regression tests need LibreOffice headless and are slower; run them
  # on a schedule and on release branches rather than every PR. This trade-off
  # is explicit: see AGENTS.md → CI/CD.
  visual:
    name: Visual regression (LibreOffice headless)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || startsWith(github.ref, 'refs/heads/release/')
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install Pandoc + Lua
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pandoc lua5.4
      - name: Install LibreOffice headless
        run: sudo apt-get install -y -qq libreoffice-writer libreoffice-impress
      - run: npm ci
      - name: Visual tests
        run: npm run test:visual
