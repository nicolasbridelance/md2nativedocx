<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Deterministic font substitution for test:visual (scripts/test-visual.mjs).

  `reference.docx`'s theme (packages/cli/assets/reference.docx) declares Word's
  modern default fonts (Aptos / Aptos Display), and older/manual reference docs
  in the wild commonly declare Calibri/Cambria — none of which ship on Linux.
  Without this override, LibreOffice's substitution for those missing families
  depends on whatever fonts happen to be installed and in what order fontconfig
  enumerates them, which differs by environment (distro, image, apt mirror
  snapshot) even when LibreOffice itself renders identically otherwise. That
  environment-dependent substitution, not a real rendering regression, is what
  caused the pre-existing baseline drift documented in TODO.md ("pinning
  LibreOffice") and the project memory it links.

  This file is loaded via FONTCONFIG_FILE only for the soffice subprocess
  test-visual.mjs spawns (see renderFixture()) — it does not touch the host's
  own fontconfig. It includes the system fonts.conf so every other family
  resolves exactly as it would otherwise; only these specific families are
  pinned, to Liberation Sans/Serif, which ship as an automatic dependency of
  libreoffice-writer on both Debian and Ubuntu (verified via `apt-cache
  depends`), so they're present in every environment that can run this script
  at all — no extra package install required.
-->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>

  <match target="pattern">
    <test name="family"><string>Aptos</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Liberation Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Aptos Display</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Liberation Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Calibri</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Liberation Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Cambria</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Liberation Serif</string></edit>
  </match>
</fontconfig>
