<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B2F7A"/>
      <stop offset="0.55" stop-color="#6D4FE0"/>
      <stop offset="1" stop-color="#9B6BFF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1B1346" flood-opacity="0.35"/>
    </filter>
    <marker id="ar" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="14" refY="9" orient="auto">
      <path d="M2,2 L15,9 L2,16 Z" fill="#FFFFFF"/>
    </marker>
  </defs>
  <rect width="960" height="480" rx="32" fill="url(#bg)"/>
  <rect width="960" height="480" rx="32" fill="url(#glow)"/>
  <circle cx="-20" cy="470" r="170" fill="#FFFFFF" fill-opacity="0.07"/>
  <circle cx="980" cy="500" r="210" fill="#FFFFFF" fill-opacity="0.06"/>
  <g font-family="DejaVu Sans, Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="480" y="98" font-size="44" font-weight="700" fill="#FFFFFF">Image PNG locale</text>
    <text x="480" y="140" font-size="22" fill="#FFFFFF" fill-opacity="0.8">Du Markdown au Word, sans aplatir les diagrammes</text>
    <g filter="url(#sh)">
      <rect x="70" y="190" width="220" height="110" rx="22" fill="#FFFFFF"/>
      <rect x="370" y="190" width="220" height="110" rx="22" fill="#FFFFFF"/>
      <rect x="670" y="190" width="220" height="110" rx="22" fill="#FFFFFF"/>
    </g>
    <text x="180" y="257" font-size="30" font-weight="700" fill="#3B2F7A">Markdown</text>
    <text x="480" y="257" font-size="30" font-weight="700" fill="#3B2F7A">Mermaid</text>
    <text x="780" y="257" font-size="30" font-weight="700" fill="#3B2F7A">Word</text>
    <g stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" fill="none">
      <line x1="298" y1="245" x2="360" y2="245" marker-end="url(#ar)"/>
      <line x1="598" y1="245" x2="660" y2="245" marker-end="url(#ar)"/>
    </g>
    <text x="480" y="410" font-size="22" fill="#FFFFFF" fill-opacity="0.85">Image insérée telle quelle dans le document</text>
  </g>
</svg>
